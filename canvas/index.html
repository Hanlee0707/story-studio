<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="sprout-completion-mode" content="manual">
<meta name="sprout-web-sites" content="https://read-along-eight.vercel.app">
<title>Story Studio</title>
<style>
:root{--ink:#2b2340;--soft:#6b6480;--paper:#fff8ef;--card:#ffffff;--line:#efe3d2;--sun:#ffb703;--berry:#e4567b;--sky:#5ab0ea;--leaf:#5fbf8a;--r:22px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-user-select:none;user-select:none}
main{min-height:100%;padding:calc(18px + var(--canvas-safe-top,0px)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand .dot{width:34px;height:34px;border-radius:50%;background:var(--berry);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 0 #c43f63}
h1{font-size:28px;line-height:1.15;margin:4px 0 0;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-size:16px;font-weight:700;color:var(--ink)}.chip:active{background:#fff1d6}
.mic{align-self:center;width:150px;height:150px;border-radius:50%;border:0;background:var(--berry);color:#fff;font-size:58px;box-shadow:0 8px 0 #c43f63, 0 0 0 0 rgba(228,86,123,.35);transition:transform .08s;display:grid;place-items:center;touch-action:none}
.mic.on{transform:scale(.96);box-shadow:0 4px 0 #c43f63,0 0 0 18px rgba(228,86,123,.22);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #c43f63,0 0 0 28px rgba(228,86,123,.08)}}
.hint{text-align:center;color:var(--soft);font-weight:700;font-size:15px;min-height:20px}
.heard{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:14px;font-size:20px;font-weight:700;min-height:64px;line-height:1.3}
.heard:empty::before{content:"Hold the button and tell me your story idea";color:#b9b2c6;font-weight:600;font-size:17px}
.typed{display:flex;gap:8px}.typed input{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff}
.btn{border:0;border-radius:var(--r);padding:16px 18px;font-size:20px;font-weight:900;color:#fff;background:var(--leaf);box-shadow:0 6px 0 #3f9a69}.btn:disabled{opacity:.45;box-shadow:none}.btn.alt{background:var(--sky);box-shadow:0 6px 0 #3b8ec4}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:17px;padding:12px 16px}
.btn:active{transform:translateY(3px);box-shadow:none}
.sec{font-weight:900;font-size:17px;color:var(--soft);margin-top:6px}
.shelf{display:flex;flex-direction:column;gap:10px}.ep{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;font:inherit;color:inherit}.ep img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#f3e9da}.ep .t{font-weight:900;font-size:17px}.ep .s{color:var(--soft);font-size:14px;font-weight:700}
.empty{color:#b9b2c6;font-weight:700;text-align:center;padding:10px}
.record{align-self:center;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 18%,#2b2340 19% 100%);box-shadow:0 10px 24px rgba(0,0,0,.18);animation:spin 2.4s linear infinite;position:relative}.record::after{content:"";position:absolute;inset:40%;border-radius:50%;border:2px dashed #6b6480}
@keyframes spin{to{transform:rotate(360deg)}}
.stages{display:flex;flex-direction:column;gap:8px}.st{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;font-size:17px;color:#b9b2c6}.st .i{width:30px;height:30px;border-radius:50%;background:#f3e9da;display:grid;place-items:center;font-size:16px}
.st.now{color:var(--ink);border-color:var(--sun)}.st.now .i{background:var(--sun)}.st.done{color:var(--ink)}.st.done .i{background:var(--leaf);color:#fff}
.art{width:100%;aspect-ratio:1;border-radius:26px;background:#f3e9da;object-fit:cover;box-shadow:0 10px 24px rgba(43,35,64,.15)}
.cap{font-size:18px;font-weight:700;line-height:1.35;min-height:48px;text-align:center}
.bar{height:10px;background:#efe3d2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--berry);transition:width .25s linear}
.dots{display:flex;justify-content:center;gap:8px}.dots b{width:12px;height:12px;border-radius:50%;background:#e6dccb}.dots b.now{background:var(--berry)}.dots b.ok{background:var(--leaf)}
.ctl{display:flex;justify-content:center;gap:14px;align-items:center}.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--berry);color:#fff;font-size:40px;box-shadow:0 7px 0 #c43f63;display:grid;place-items:center}.play:active{transform:translateY(3px);box-shadow:none}.small{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
</style></head><body>
<main id="home">
  <div class="brand"><span class="dot">🎙️</span>Story Studio</div>
  <h1 id="ask">What story do you want tonight?</h1>
  <div class="chips" id="chips"></div>
  <button class="mic" id="mic" type="button" aria-label="Hold to talk">🎤</button>
  <div class="hint" id="hint">Hold to talk</div>
  <div class="heard" id="heard"></div>
  <div class="typed" id="typed" hidden><input id="typeIn" placeholder="or type a story idea"><button class="btn ghost" id="typeOk" type="button">Use</button></div>
  <button class="btn" id="make" type="button" disabled>Make my story ✨</button>
  <div class="sec">Your stories</div>
  <div class="shelf" id="shelf"><p class="empty">Nothing here yet. Ask for one!</p></div>
</main>
<main id="making" hidden>
  <div class="brand"><span class="dot">🎙️</span>Story Studio</div>
  <div class="record"></div>
  <h1 id="mkTitle">The studio is making your story</h1>
  <div class="hint" id="mkAsk"></div>
  <div class="stages" id="stages"></div>
  <button class="btn ghost" id="mkBack" type="button">Back</button>
</main>
<main id="player" hidden>
  <div class="brand"><span class="dot">🎙️</span><span id="plTitle">Your story</span></div>
  <img class="art" id="art" alt="">
  <div class="cap" id="cap"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="dots" id="dots"></div>
  <div class="hint" id="plHint"></div>
  <div class="ctl"><button class="small" id="back10" type="button" aria-label="Back ten seconds">⟲</button><button class="play" id="play" type="button" aria-label="Play">▶</button><button class="small" id="next" type="button" aria-label="Next scene">⏭</button></div>
  <div class="row"><button class="btn ghost" id="plHome" type="button">More stories</button><button class="btn alt" id="done" type="button">Done ✓</button></div>
</main>
<audio id="au" preload="auto" playsinline webkit-playsinline></audio>
<div class="toast" id="toast"></div>
<script>
const CFG = { wake: 'https://read-along-eight.vercel.app/api/wake', key: '0ce8348d528e33a7f98ae72ee9b5ba48' };
const IDEAS = ['BTS go camping', 'Jimin and a lost puppy', 'BTS bake a giant cake', 'Jungkook learns to fly'];
const STAGES = [['asked', 'Sent to the studio'], ['writing', 'Writing your story'], ['voicing', 'Voices and pictures'], ['playing', 'First scene is ready!']];
const $ = id => document.getElementById(id);
const hasSprout = typeof sprout !== 'undefined' && sprout;
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let db = null, self = 'preview', ask = '', unsubShelf = null, episodes = [];
function show(id){ for (const m of ['home', 'making', 'player']) $(m).hidden = m !== id; window.scrollTo(0, 0); }
let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }
function say(text){ if (hasSprout && sprout.tts && typeof sprout.tts.speak === 'function'){ try { const p = sprout.tts.speak({ text }); if (p && p.catch) p.catch(() => {}); } catch {} } }

/* ---------- ask: chips, hold-to-talk, typed fallback ---------- */
$('chips').innerHTML = IDEAS.map(t => `<button class="chip" type="button">${esc(t)}</button>`).join('');
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) setAsk(b.textContent); };
function setAsk(t){ ask = String(t || '').trim().slice(0, 200); $('heard').textContent = ask; $('make').disabled = !ask; }
const speechOk = () => hasSprout && sprout.speech && typeof sprout.speech.listen === 'function';
let listening = false, pollT = null, cursor = 0, words = [], gen = 0;
async function holdStart(e){
  e.preventDefault();
  if (listening) return;
  if (!speechOk()){ $('typed').hidden = false; $('hint').textContent = 'No microphone here, type it instead'; return; }
  const g = ++gen; words = []; cursor = 0;
  let st; try { st = await sprout.speech.listen({}); } catch { st = { status: 'blocked' }; }
  if (g !== gen) { if (st && st.status === 'listening') stopHost(); return; }
  if (!st || st.status !== 'listening'){ $('hint').textContent = st && st.reason === 'permission_denied' ? 'A grown-up can turn the microphone on in Settings' : 'I cannot hear right now, tap an idea instead'; $('typed').hidden = false; return; }
  listening = true; $('mic').classList.add('on'); $('hint').textContent = 'Listening…';
  pollT = setInterval(poll, 150);
}
let polling = false;
async function poll(){
  if (polling || !listening) return; polling = true;
  try {
    const h = await sprout.speech.poll({ since: cursor });
    cursor = h.next;
    for (const w of h.words || []) words.push(w.text);
    const live = (h.live || []).map(w => w.text).join(' ');
    $('heard').textContent = (words.join(' ') + ' ' + live).trim();
    if (h.status === 'ended') endListening();
  } catch {} finally { polling = false; }
}
function stopHost(){ try { const p = sprout.speech.stop(); if (p && p.catch) p.catch(() => {}); } catch {} }
async function holdEnd(e){
  if (e) e.preventDefault();
  if (!listening){ gen++; return; }
  await endListening(true);
}
async function endListening(fromHand){
  listening = false; gen++; clearInterval(pollT); pollT = null; $('mic').classList.remove('on');
  if (fromHand){ try { await sprout.speech.stop(); const t = await sprout.speech.poll({ since: cursor }); for (const w of (t.words || []).concat(t.live || [])) words.push(w.text); } catch {} }
  setAsk(words.join(' '));
  $('hint').textContent = ask ? 'Tap Make my story, or hold to try again' : 'I did not catch that, hold and try again';
}
for (const ev of ['pointerdown', 'touchstart']) $('mic').addEventListener(ev, holdStart, { passive: false });
for (const ev of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) $('mic').addEventListener(ev, holdEnd, { passive: false });
$('typeOk').onclick = () => setAsk($('typeIn').value);
$('typeIn').addEventListener('keydown', e => { if (e.key === 'Enter') setAsk($('typeIn').value); });
$('ask').onclick = () => say('What story do you want tonight?');

/* ---------- the request: one document, then the wake ---------- */
let current = null, unsubReq = null, unsubEp = null;
$('make').onclick = async () => {
  if (!ask) return;
  if (!db){ toast('The studio is not connected in this preview'); return; }
  const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  $('make').disabled = true;
  try { await db.doc(`data/users/${self}/requests/${id}`).set({ ask, status: 'asked', askedAt: new Date().toISOString() }); }
  catch (e) { $('make').disabled = false; toast('That did not send, try again'); return; }
  say('Ooh. I am sending that to the studio. It takes a minute or two.');
  openMaking(id, ask);
  let woke = false;
  if (hasSprout && sprout.net && typeof sprout.net.fetch === 'function'){
    try { const r = await sprout.net.fetch({ url: `${CFG.wake}?req=${id}&kid=${encodeURIComponent(self)}&key=${CFG.key}`, accept: 'json' }); woke = r && r.status === 'ok' && r.json && r.json.ok === true; } catch {}
  }
  if (!woke) $('mkAsk').textContent = `“${ask}” · the studio will pick this up on its next round`;
  $('make').disabled = false;
};
function openMaking(id, text){
  current = { id, status: 'asked', title: '', scenes: [] };
  $('mkAsk').textContent = `“${text}”`; $('mkTitle').textContent = 'The studio is making your story';
  renderStages('asked'); show('making');
  if (unsubReq) unsubReq(); if (unsubEp) unsubEp();
  unsubReq = db.doc(`data/users/${self}/requests/${id}`).onSnapshot(s => { if (!s.exists) return; const d = s.data(); if (current && current.id === id) renderStages(d.status); }, () => {});
  unsubEp = db.doc(`episodes/${id}`).onSnapshot(s => { if (!s.exists || !current || current.id !== id) return; const m = s.data(); Object.assign(current, m); if (m.title) $('mkTitle').textContent = m.title; if (m.status === 'playing' || m.status === 'ready'){ if ($('player').hidden) openPlayer(current); else refreshPlayer(); } }, () => {});
}
function renderStages(status){
  const idx = STAGES.findIndex(s => s[0] === status), at = status === 'ready' ? STAGES.length : idx;
  $('stages').innerHTML = STAGES.map((s, i) => `<div class="st ${i < at ? 'done' : i === at ? 'now' : ''}"><span class="i">${i < at ? '✓' : i === at ? '…' : ''}</span>${esc(s[1])}</div>`).join('');
}
$('mkBack').onclick = () => { show('home'); };

/* ---------- the shelf ---------- */
function renderShelf(){
  const mine = episodes.filter(e => e.title && (e.status === 'playing' || e.status === 'ready' || e.status === 'voicing'));
  $('shelf').innerHTML = mine.length ? mine.map(e => `<button class="ep" type="button" data-id="${esc(e.id)}"><img alt="" data-art="${esc(e.id)}"><span><span class="t">${esc(e.title)}</span><br><span class="s">${e.status === 'ready' ? (e.scenes || []).length + ' scenes' : 'still in the studio…'}</span></span></button>`).join('') : '<p class="empty">Nothing here yet. Ask for one!</p>';
  for (const img of $('shelf').querySelectorAll('img[data-art]')) artFor(img.dataset.art, 0).then(src => { if (src) img.src = src; }).catch(() => {});
}
$('shelf').onclick = e => { const b = e.target.closest('.ep'); if (!b) return; const ep = episodes.find(x => x.id === b.dataset.id); if (ep) openPlayer(ep); };

/* ---------- the player: scenes arrive as base64 documents; play one while the next loads ---------- */
const au = $('au'); const cache = {};
async function artFor(id, n){
  const k = `${id}/art/${n}`; if (cache[k]) return cache[k];
  const s = await db.doc(`episodes/${id}/scenes/${n}/art`).get(); if (!s.exists) return null;
  return (cache[k] = 'data:image/jpeg;base64,' + s.data().jpegB64);
}
async function audioFor(ep, n){
  const k = `${ep.id}/au/${n}`; if (cache[k]) return cache[k];
  const sc = (ep.scenes || [])[n]; if (!sc || !sc.parts) return null;
  let b64 = '';
  for (let i = 0; i < sc.parts; i++){ const s = await db.doc(`episodes/${ep.id}/scenes/${n}/audio/${i}`).get(); if (!s.exists) return null; b64 += s.data().b64; }
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return (cache[k] = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' })));
}
let ep = null, scene = 0, wantPlay = false, loadingScene = -1;
function openPlayer(e){
  ep = e; scene = 0; wantPlay = false; au.pause(); au.removeAttribute('src');
  $('plTitle').textContent = ep.title || 'Your story'; $('cap').textContent = ''; $('art').removeAttribute('src'); $('barFill').style.width = '0';
  if (unsubEp && (!current || current.id !== ep.id)){ unsubEp(); unsubEp = null; }
  if (!current || current.id !== ep.id){ current = ep; unsubEp = db.doc(`episodes/${ep.id}`).onSnapshot(s => { if (s.exists && ep && ep.id === s.id) { Object.assign(ep, s.data()); refreshPlayer(); } }, () => {}); }
  show('player'); refreshPlayer(); loadScene(0);
}
function refreshPlayer(){
  if (!ep) return;
  $('plTitle').textContent = ep.title || 'Your story';
  const n = (ep.scenes || []).length;
  $('dots').innerHTML = (ep.scenes || []).map((s, i) => `<b class="${i === scene ? 'now' : s.parts ? 'ok' : ''}"></b>`).join('');
  $('plHint').textContent = ep.status === 'ready' ? '' : 'The studio is still mixing the next scenes…';
  if (wantPlay && loadingScene === -1 && !au.src) loadScene(scene);
}
async function loadScene(n, andPlay){
  if (!ep) return; const sc = (ep.scenes || [])[n];
  scene = n; refreshPlayer();
  if (sc) $('cap').textContent = sc.caption || '';
  artFor(ep.id, n).then(src => { if (src && scene === n) $('art').src = src; }).catch(() => {});
  if (!sc || !sc.parts){ $('plHint').textContent = 'The studio is still mixing this scene… it starts by itself'; au.removeAttribute('src'); return; }
  loadingScene = n;
  let url = null; try { url = await audioFor(ep, n); } catch {}
  loadingScene = -1;
  if (scene !== n) return;
  if (!url){ $('plHint').textContent = 'This scene did not load, tap next'; return; }
  au.src = url; au.load();
  if (andPlay || wantPlay){ const p = au.play(); if (p && p.catch) p.catch(() => { wantPlay = false; $('play').textContent = '▶'; }); }
  if (sc.parts && (ep.scenes || [])[n + 1] && (ep.scenes || [])[n + 1].parts) audioFor(ep, n + 1).catch(() => {});
}
$('play').onclick = () => {
  if (!ep) return;
  if (!au.paused){ au.pause(); wantPlay = false; $('play').textContent = '▶'; return; }
  wantPlay = true; $('play').textContent = '❚❚';
  if (au.src){ const p = au.play(); if (p && p.catch) p.catch(() => {}); } else loadScene(scene, true);
};
au.addEventListener('play', () => { $('play').textContent = '❚❚'; });
au.addEventListener('pause', () => { if (au.ended) return; $('play').textContent = '▶'; });
au.addEventListener('timeupdate', () => { if (au.duration) $('barFill').style.width = (au.currentTime / au.duration * 100) + '%'; });
au.addEventListener('ended', () => { const next = scene + 1; if (next < (ep.scenes || []).length) loadScene(next, true); else { wantPlay = false; $('play').textContent = '▶'; $('plHint').textContent = 'The end! Tap Done, or ask for another.'; say('The end. Did you like it?'); } });
$('back10').onclick = () => { if (au.src) au.currentTime = Math.max(0, au.currentTime - 10); };
$('next').onclick = () => { if (!ep) return; const next = scene + 1; if (next < (ep.scenes || []).length) loadScene(next, wantPlay); };
$('plHome').onclick = () => { au.pause(); wantPlay = false; show('home'); };
$('done').onclick = () => {
  au.pause();
  if (hasSprout && typeof sprout.complete === 'function') sprout.complete({ summary: `Listened to “${(ep && ep.title) || 'a story'}”` });
  else toast('Done! (preview)');
};

/* ---------- start ---------- */
(async () => {
  try { if (hasSprout && typeof sprout.use === 'function') db = await sprout.use('db'); } catch { db = null; }
  if (!db){ $('typed').hidden = false; $('hint').textContent = 'Preview: type a story idea'; return; }
  self = db.self || self;
  unsubShelf = db.collection('episodes').where('kid', '==', self).orderBy('createdAt', 'desc').limit(20).onSnapshot(q => { episodes = q.docs.map(d => Object.assign({ id: d.id }, d.data())); renderShelf(); }, () => {});
  say('What story do you want tonight?');
})();
</script></body></html>
