<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="sprout-completion-mode" content="manual">
<meta name="sprout-web-sites" content="https://read-along-eight.vercel.app">
<title>Story Studio</title>
<style>
:root{--ink:#1d1633;--soft:#7a7290;--paper:#fff6ea;--card:#fff;--sun:#ffb703;--berry:#ff5c8a;--berryD:#d9426e;--plum:#2b2340;--leaf:#4fc98f;--leafD:#2f9f69;--r:26px;--bottom:calc(172px + env(safe-area-inset-bottom))}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 20% -10%,#ffe3b3 0,transparent 60%),radial-gradient(700px 500px at 110% 20%,#ffd6e2 0,transparent 60%),radial-gradient(600px 400px at 50% 110%,#d9f3e6 0,transparent 60%);pointer-events:none;z-index:-1}
main{min-height:100%;padding:calc(14px + var(--canvas-safe-top,0px)) 18px var(--bottom);display:flex;flex-direction:column;gap:16px;max-width:600px;margin:0 auto}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;letter-spacing:-.01em}.brand .dot{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,var(--berry),#ff8fb1);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px rgba(255,92,138,.35)}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--soft);font-weight:700;font-size:15px;line-height:1.35}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 8px;margin:0 -18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:0;background:var(--card);border-radius:999px;padding:12px 16px;font-size:16px;font-weight:800;color:var(--ink);box-shadow:0 4px 12px rgba(43,35,64,.08)}.chip:active{transform:scale(.97);background:#fff1d6}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.mic{width:168px;height:168px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8fb1,var(--berry) 60%,var(--berryD));color:#fff;font-size:66px;box-shadow:0 14px 30px rgba(255,92,138,.45),inset 0 -8px 0 rgba(0,0,0,.12);display:grid;place-items:center;touch-action:none;transition:transform .1s}
.mic.on{transform:scale(1.06);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 14px 30px rgba(255,92,138,.45),0 0 0 0 rgba(255,92,138,.45)}100%{box-shadow:0 14px 30px rgba(255,92,138,.45),0 0 0 34px rgba(255,92,138,0)}}
.hint{text-align:center;color:var(--soft);font-weight:800;font-size:15px;min-height:20px}
.heard{background:var(--card);border-radius:var(--r);padding:16px 18px;font-size:21px;font-weight:800;min-height:70px;line-height:1.3;box-shadow:0 8px 24px rgba(43,35,64,.08)}
.heard:empty::before{content:"Hold the big button and tell me your story idea";color:#c2bacf;font-weight:700;font-size:17px}
.typed{display:flex;gap:8px}.typed input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 12px rgba(43,35,64,.08)}
.btn{border:0;border-radius:var(--r);padding:18px 20px;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--leaf),var(--leafD));box-shadow:0 10px 22px rgba(47,159,105,.35)}.btn:disabled{opacity:.4;box-shadow:none;filter:grayscale(.4)}.btn.alt{background:linear-gradient(135deg,#6cc0f5,#3b8ec4);box-shadow:0 10px 22px rgba(59,142,196,.35)}.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(43,35,64,.08);font-size:17px;padding:14px 16px}
.btn:active{transform:translateY(2px) scale(.99)}
.sec{font-weight:900;font-size:18px;margin-top:4px;display:flex;align-items:baseline;gap:8px}.sec small{color:var(--soft);font-weight:700;font-size:14px}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ep{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:1;background:#eadfcf;box-shadow:0 10px 24px rgba(43,35,64,.14);text-align:left;font:inherit;color:#fff}.ep img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ep .t{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;font-weight:900;font-size:16px;line-height:1.15;background:linear-gradient(transparent,rgba(29,22,51,.85));text-shadow:0 1px 2px rgba(0,0,0,.4)}.ep .s{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:3px}.ep.cooking::after{content:"🎚️ in the studio…";position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);color:var(--ink);font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px}
.empty{grid-column:1/-1;color:#c2bacf;font-weight:700;text-align:center;padding:18px}
.vinyl{align-self:center;width:200px;height:200px;border-radius:50%;background:repeating-radial-gradient(circle,#2b2340 0 3px,#342b4c 3px 5px);box-shadow:0 18px 40px rgba(43,35,64,.3);animation:spin 2.6s linear infinite;position:relative;display:grid;place-items:center}.vinyl img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:4px solid var(--sun);background:var(--sun)}.vinyl::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--paper)}
@keyframes spin{to{transform:rotate(360deg)}}
.stages{display:flex;flex-direction:column;gap:8px}.st{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px 15px;font-weight:800;font-size:17px;color:#c2bacf;box-shadow:0 4px 12px rgba(43,35,64,.06);transition:transform .2s}.st .i{width:32px;height:32px;border-radius:50%;background:#f3e9da;display:grid;place-items:center;font-size:16px}
.st.now{color:var(--ink);transform:scale(1.02);box-shadow:0 10px 24px rgba(255,183,3,.3)}.st.now .i{background:var(--sun)}.st.done{color:var(--ink)}.st.done .i{background:var(--leaf);color:#fff}
#player{padding-top:0;gap:0}
.hero{position:relative;margin:0 -18px;height:min(62vh,560px);overflow:hidden;border-radius:0 0 34px 34px;background:#1d1633;box-shadow:0 18px 40px rgba(29,22,51,.3)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease;transform:scale(1.02)}.hero img.show{opacity:1;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.1) translate(-2%,-2%)}}
.hero .top{position:absolute;top:calc(10px + var(--canvas-safe-top,0px));left:14px;right:14px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hero .top .dot{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:17px}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 20px;color:#fff;font-size:19px;font-weight:800;line-height:1.35;background:linear-gradient(transparent,rgba(29,22,51,.92));text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pbar{margin:18px 0 0;height:12px;border-radius:99px;overflow:hidden;display:flex;gap:3px}.pbar i{flex:1;height:100%;background:#e6dccb;position:relative;overflow:hidden;border-radius:4px}.pbar i b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--berry),#ff8fb1)}.pbar i.ok b{width:100%;background:#f7b9cb}
.plHint{text-align:center;color:var(--soft);font-weight:800;font-size:14px;min-height:18px;margin-top:10px}
.ctl{display:flex;justify-content:center;gap:18px;align-items:center;margin-top:10px}.play{width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8fb1,var(--berry) 60%,var(--berryD));color:#fff;font-size:44px;box-shadow:0 14px 30px rgba(255,92,138,.45);display:grid;place-items:center}.play:active{transform:scale(.96)}.small{width:62px;height:62px;border-radius:50%;border:0;background:#fff;font-size:24px;box-shadow:0 6px 16px rgba(43,35,64,.12)}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:var(--bottom);background:var(--plum);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
</style></head><body>
<main id="home">
  <div class="brand"><span class="dot">🎙️</span>Story Studio</div>
  <h1 id="ask">What story do you want tonight?</h1>
  <div class="sub">Tap an idea, or hold the big button and tell me.</div>
  <div class="chips" id="chips"></div>
  <div class="stage"><button class="mic" id="mic" type="button" aria-label="Hold to talk">🎤</button><div class="hint" id="hint">Hold to talk</div></div>
  <div class="heard" id="heard"></div>
  <div class="typed" id="typed" hidden><input id="typeIn" placeholder="or type a story idea"><button class="btn ghost" id="typeOk" type="button">Use</button></div>
  <button class="btn" id="make" type="button" disabled>Make my story ✨</button>
  <div class="sec">Your stories <small id="count"></small></div>
  <div class="shelf" id="shelf"><p class="empty">Nothing here yet. Ask for one!</p></div>
</main>
<main id="making" hidden>
  <div class="brand"><span class="dot">🎙️</span>Story Studio</div>
  <div class="vinyl"><img id="mkArt" alt="" hidden></div>
  <h1 id="mkTitle">The studio is making your story</h1>
  <div class="sub" id="mkAsk"></div>
  <div class="stages" id="stages"></div>
  <button class="btn ghost" id="mkBack" type="button">Back</button>
</main>
<main id="player" hidden>
  <div class="hero"><img id="artA" alt=""><img id="artB" alt=""><div class="top"><span class="dot">🎙️</span><span id="plTitle">Your story</span></div><div class="cap" id="cap"></div></div>
  <div class="pbar" id="pbar"></div>
  <div class="plHint" id="plHint"></div>
  <div class="ctl"><button class="small" id="back10" type="button" aria-label="Back ten seconds">⟲</button><button class="play" id="play" type="button" aria-label="Play">▶</button><button class="small" id="next" type="button" aria-label="Next scene">⏭</button></div>
  <div class="row"><button class="btn ghost" id="plHome" type="button">More stories</button><button class="btn alt" id="done" type="button">Done ✓</button></div>
</main>
<audio id="au" preload="auto" playsinline webkit-playsinline></audio>
<div class="toast" id="toast"></div>
<script>
const CFG = { wake: 'https://read-along-eight.vercel.app/api/wake', key: '0ce8348d528e33a7f98ae72ee9b5ba48' };
const IDEAS = ['BTS go camping', 'Jimin finds a lost puppy', 'BTS bake a giant cake', 'V learns to fly', 'A sleepover in a treehouse'];
const STAGES = [['asked', 'Sent to the studio'], ['writing', 'Writing your story'], ['voicing', 'Voices and pictures'], ['playing', 'First scene is ready!']];
const $ = id => document.getElementById(id);
const hasSprout = typeof sprout !== 'undefined' && sprout;
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let db = null, self = 'preview', ask = '', episodes = [];
function show(id){ for (const m of ['home', 'making', 'player']) $(m).hidden = m !== id; window.scrollTo(0, 0); }
let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }
function say(text){ if (hasSprout && sprout.tts && typeof sprout.tts.speak === 'function'){ try { const p = sprout.tts.speak({ text }); if (p && p.catch) p.catch(() => {}); } catch {} } }

/* ---------- ask: chips, hold-to-talk, typed fallback ---------- */
$('chips').innerHTML = IDEAS.map(t => `<button class="chip" type="button">${esc(t)}</button>`).join('');
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) setAsk(b.textContent); };
function setAsk(t){ ask = String(t || '').trim().slice(0, 200); $('heard').textContent = ask; $('make').disabled = !ask; }
const speechOk = () => hasSprout && sprout.speech && typeof sprout.speech.listen === 'function';
let listening = false, pollT = null, cursor = 0, words = [], gen = 0;
async function holdStart(e){
  e.preventDefault();
  if (listening) return;
  if (!speechOk()){ $('typed').hidden = false; $('hint').textContent = 'No microphone here, type it instead'; return; }
  const g = ++gen; words = []; cursor = 0;
  let st; try { st = await sprout.speech.listen({}); } catch { st = { status: 'blocked' }; }
  if (g !== gen) { if (st && st.status === 'listening') stopHost(); return; }
  if (!st || st.status !== 'listening'){ $('hint').textContent = st && st.reason === 'permission_denied' ? 'A grown-up can turn the microphone on in Settings' : 'I cannot hear right now, tap an idea instead'; $('typed').hidden = false; return; }
  listening = true; $('mic').classList.add('on'); $('hint').textContent = 'Listening…';
  pollT = setInterval(poll, 150);
}
let polling = false;
async function poll(){
  if (polling || !listening) return; polling = true;
  try {
    const h = await sprout.speech.poll({ since: cursor });
    cursor = h.next;
    for (const w of h.words || []) words.push(w.text);
    const live = (h.live || []).map(w => w.text).join(' ');
    $('heard').textContent = (words.join(' ') + ' ' + live).trim();
    if (h.status === 'ended') endListening();
  } catch {} finally { polling = false; }
}
function stopHost(){ try { const p = sprout.speech.stop(); if (p && p.catch) p.catch(() => {}); } catch {} }
async function holdEnd(e){ if (e) e.preventDefault(); if (!listening){ gen++; return; } await endListening(true); }
async function endListening(fromHand){
  listening = false; gen++; clearInterval(pollT); pollT = null; $('mic').classList.remove('on');
  if (fromHand){ try { await sprout.speech.stop(); const t = await sprout.speech.poll({ since: cursor }); for (const w of (t.words || []).concat(t.live || [])) words.push(w.text); } catch {} }
  setAsk(words.join(' '));
  $('hint').textContent = ask ? 'Tap Make my story, or hold to try again' : 'I did not catch that, hold and try again';
}
for (const ev of ['pointerdown', 'touchstart']) $('mic').addEventListener(ev, holdStart, { passive: false });
for (const ev of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) $('mic').addEventListener(ev, holdEnd, { passive: false });
$('typeOk').onclick = () => setAsk($('typeIn').value);
$('typeIn').addEventListener('keydown', e => { if (e.key === 'Enter') setAsk($('typeIn').value); });
$('ask').onclick = () => say('What story do you want tonight?');

/* ---------- the request: one document, then the wake ---------- */
let current = null, unsubReq = null, unsubEp = null;
$('make').onclick = async () => {
  if (!ask) return;
  if (!db){ toast('The studio is not connected in this preview'); return; }
  const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  $('make').disabled = true;
  try { await db.doc(`data/users/${self}/requests/items/${id}`).set({ ask, status: 'asked', askedAt: new Date().toISOString() }); }
  catch (e) { $('make').disabled = false; toast('That did not send, try again'); return; }
  say('Ooh. I am sending that to the studio. It takes a minute or two.');
  openMaking(id, ask);
  let woke = false;
  if (hasSprout && sprout.net && typeof sprout.net.fetch === 'function'){
    try { const r = await sprout.net.fetch({ url: `${CFG.wake}?req=${id}&kid=${encodeURIComponent(self)}&key=${CFG.key}`, accept: 'json' }); woke = r && r.status === 'ok' && r.body && r.body.ok === true; } catch {}
  }
  if (!woke) $('mkAsk').textContent = `“${ask}” · the studio will pick this up on its next round`;
  $('make').disabled = false;
};
function openMaking(id, text){
  current = { id, status: 'asked', title: '', scenes: [] };
  $('mkAsk').textContent = `“${text}”`; $('mkTitle').textContent = 'The studio is making your story'; $('mkArt').hidden = true;
  renderStages('asked'); show('making');
  if (unsubReq) unsubReq(); if (unsubEp) unsubEp();
  unsubReq = db.doc(`data/users/${self}/requests/items/${id}`).onSnapshot(s => { if (!s.exists) return; const d = s.data(); if (current && current.id === id) renderStages(d.status); }, () => {});
  unsubEp = db.doc(`episodes/${id}`).onSnapshot(s => { if (!s.exists || !current || current.id !== id) return; const m = s.data(); Object.assign(current, m); if (m.title) $('mkTitle').textContent = m.title; coverFor(id).then(src => { if (src && $('mkArt').hidden){ $('mkArt').src = src; $('mkArt').hidden = false; } }).catch(() => {}); if (m.status === 'playing' || m.status === 'ready'){ if ($('player').hidden) openPlayer(current); else refreshPlayer(); } }, () => {});
}
function renderStages(status){
  const idx = STAGES.findIndex(s => s[0] === status), at = status === 'ready' ? STAGES.length : idx;
  $('stages').innerHTML = STAGES.map((s, i) => `<div class="st ${i < at ? 'done' : i === at ? 'now' : ''}"><span class="i">${i < at ? '✓' : i === at ? '…' : ''}</span>${esc(s[1])}</div>`).join('');
}
$('mkBack').onclick = () => { show('home'); };

/* ---------- the shelf ---------- */
function renderShelf(){
  const mine = episodes.filter(e => e.title && (e.status === 'playing' || e.status === 'ready' || e.status === 'voicing'));
  $('count').textContent = mine.length ? mine.length + (mine.length === 1 ? ' story' : ' stories') : '';
  $('shelf').innerHTML = mine.length ? mine.map(e => `<button class="ep ${e.status === 'ready' ? '' : 'cooking'}" type="button" data-id="${esc(e.id)}"><img alt="" data-cover="${esc(e.id)}"><span class="t">${esc(e.title)}<span class="s">${(e.scenes || []).length} scenes</span></span></button>`).join('') : '<p class="empty">Nothing here yet. Ask for one!</p>';
  for (const img of $('shelf').querySelectorAll('img[data-cover]')) coverFor(img.dataset.cover).then(src => { if (src) img.src = src; }).catch(() => {});
}
$('shelf').onclick = e => { const b = e.target.closest('.ep'); if (!b) return; const ep = episodes.find(x => x.id === b.dataset.id); if (ep) openPlayer(ep); };

/* ---------- the player: scenes arrive as base64 documents; play one while the next loads ---------- */
const au = $('au'); const cache = {};
async function coverFor(id){
  const k = `${id}/cover`; if (cache[k]) return cache[k];
  let s = await db.doc(`episodes/${id}/cover/0`).get();
  if (!s.exists) s = await db.doc(`episodes/${id}/art/0`).get();
  if (!s.exists) return null;
  return (cache[k] = 'data:image/jpeg;base64,' + s.data().jpegB64);
}
async function artFor(id, n){
  const k = `${id}/art/${n}`; if (cache[k]) return cache[k];
  const s = await db.doc(`episodes/${id}/art/${n}`).get(); if (!s.exists) return null;
  return (cache[k] = 'data:image/jpeg;base64,' + s.data().jpegB64);
}
async function audioFor(ep, n){
  const k = `${ep.id}/au/${n}`; if (cache[k]) return cache[k];
  const sc = (ep.scenes || [])[n]; if (!sc || !sc.parts) return null;
  let b64 = '';
  for (let i = 0; i < sc.parts; i++){ const s = await db.doc(`episodes/${ep.id}/scenes/${n}/audio/${i}`).get(); if (!s.exists) return null; b64 += s.data().b64; }
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return (cache[k] = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' })));
}
let ep = null, scene = 0, wantPlay = false, loadingScene = -1, frontA = false;
function showArt(src){
  if (!src) return;
  const next = frontA ? $('artB') : $('artA'), prev = frontA ? $('artA') : $('artB');
  next.src = src; next.classList.add('show'); prev.classList.remove('show'); frontA = !frontA;
}
function openPlayer(e){
  ep = e; scene = 0; wantPlay = false; au.pause(); au.removeAttribute('src');
  $('plTitle').textContent = ep.title || 'Your story'; $('cap').textContent = ''; $('artA').classList.remove('show'); $('artB').classList.remove('show');
  if (unsubEp && (!current || current.id !== ep.id)){ unsubEp(); unsubEp = null; }
  if (!current || current.id !== ep.id){ current = ep; unsubEp = db.doc(`episodes/${ep.id}`).onSnapshot(s => { if (s.exists && ep && ep.id === s.id) { Object.assign(ep, s.data()); refreshPlayer(); } }, () => {}); }
  show('player'); refreshPlayer(); loadScene(0);
}
function refreshPlayer(){
  if (!ep) return;
  $('plTitle').textContent = ep.title || 'Your story';
  const scenes = ep.scenes || [];
  if ($('pbar').children.length !== scenes.length) $('pbar').innerHTML = scenes.map(() => '<i><b></b></i>').join('');
  [...$('pbar').children].forEach((el, i) => { el.className = i < scene ? 'ok' : ''; if (i !== scene) el.firstChild.style.width = i < scene ? '100%' : '0'; });
  $('plHint').textContent = ep.status === 'ready' ? `Scene ${scene + 1} of ${scenes.length}` : 'The studio is still mixing the next scenes…';
  if (wantPlay && loadingScene === -1 && !au.src) loadScene(scene);
}
async function loadScene(n, andPlay){
  if (!ep) return; const sc = (ep.scenes || [])[n];
  scene = n; refreshPlayer();
  if (sc) $('cap').textContent = sc.caption || '';
  artFor(ep.id, n).then(src => { if (scene === n) showArt(src); }).catch(() => {});
  if (!sc || !sc.parts){ $('plHint').textContent = 'The studio is still mixing this scene… it starts by itself'; au.removeAttribute('src'); return; }
  loadingScene = n;
  let url = null; try { url = await audioFor(ep, n); } catch {}
  loadingScene = -1;
  if (scene !== n) return;
  if (!url){ $('plHint').textContent = 'This scene did not load, tap next'; return; }
  au.src = url; au.load();
  if (andPlay || wantPlay){ const p = au.play(); if (p && p.catch) p.catch(() => { wantPlay = false; $('play').textContent = '▶'; }); }
  const nx = (ep.scenes || [])[n + 1];
  if (nx && nx.parts){ audioFor(ep, n + 1).catch(() => {}); artFor(ep.id, n + 1).catch(() => {}); }
}
$('play').onclick = () => {
  if (!ep) return;
  if (!au.paused){ au.pause(); wantPlay = false; $('play').textContent = '▶'; return; }
  wantPlay = true; $('play').textContent = '❚❚';
  if (au.src){ const p = au.play(); if (p && p.catch) p.catch(() => {}); } else loadScene(scene, true);
};
au.addEventListener('play', () => { $('play').textContent = '❚❚'; });
au.addEventListener('pause', () => { if (au.ended) return; $('play').textContent = '▶'; });
au.addEventListener('timeupdate', () => { const el = $('pbar').children[scene]; if (el && au.duration) el.firstChild.style.width = (au.currentTime / au.duration * 100) + '%'; });
au.addEventListener('ended', () => { const next = scene + 1; if (next < (ep.scenes || []).length) loadScene(next, true); else { wantPlay = false; $('play').textContent = '▶'; $('plHint').textContent = 'The end! Tap Done, or ask for another.'; say('The end. Did you like it?'); } });
$('back10').onclick = () => { if (au.src) au.currentTime = Math.max(0, au.currentTime - 10); };
$('next').onclick = () => { if (!ep) return; const next = scene + 1; if (next < (ep.scenes || []).length) loadScene(next, wantPlay); };
$('plHome').onclick = () => { au.pause(); wantPlay = false; show('home'); };
$('done').onclick = () => {
  au.pause();
  if (hasSprout && typeof sprout.complete === 'function') sprout.complete({ summary: `Listened to “${(ep && ep.title) || 'a story'}”` });
  else toast('Done! (preview)');
};

/* ---------- start ---------- */
(async () => {
  try { if (hasSprout && typeof sprout.use === 'function') db = await sprout.use('db'); } catch { db = null; }
  if (!db){ $('typed').hidden = false; $('hint').textContent = 'Preview: type a story idea'; return; }
  self = db.self || self;
  db.collection('episodes').where('kid', '==', self).orderBy('createdAt', 'desc').limit(20).onSnapshot(q => { episodes = q.docs.map(d => Object.assign({ id: d.id }, d.data())); renderShelf(); }, () => {});
  say('What story do you want tonight?');
})();
</script></body></html>
